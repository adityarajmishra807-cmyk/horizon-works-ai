name: Sync Horizon source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current Horizon source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/horizon-source
          git clone --depth 1 https://github.com/adityarajmishra807-cmyk/hw-outreach-panel1.git /tmp/horizon-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/horizon-source/. .
          rm -rf .git .github
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git checkout -B main FETCH_HEAD

      - name: Commit copied source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Target already matches source."
            exit 0
          fi
          git commit -m "chore: copy current Horizon source [skip ci]"
          git push origin HEAD:main
